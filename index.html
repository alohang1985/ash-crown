<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잿빛 왕관 · 시제품</title><script data-goatcounter="https://alohang1985.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b0a;--bg2:#17130f;--card:#1f1a15;--line:#3a3027;--ink:#efe4cf;--ink2:#b9ab92;--ink3:#7d705d;--gold:#e0b04a;--red:#c4372b;
 --g0:#b8b8b8;--g1:#5fcf6e;--g2:#4aa3ff;--g3:#ff4d4d;--g4:#ffb22e;--g5:#d77bff}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a1d12,transparent),var(--bg);color:var(--ink);font-family:'Noto Serif KR',serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:12px 14px 90px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-weight:900;font-size:22px;letter-spacing:.04em;color:var(--gold);text-shadow:0 0 18px rgba(224,176,74,.35)}
.logo small{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.2em;font-weight:500}
.cur{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.cur span{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap}.cur b{color:var(--gold)}
.ticker{margin:10px 0;border:1px solid #4a3a22;background:linear-gradient(90deg,#1c140b,#120e0a);border-radius:8px;height:30px;overflow:hidden;position:relative;font-size:13px}
.ticker div{position:absolute;white-space:nowrap;top:5px;left:100%;animation:tick 14s linear}
@keyframes tick{to{transform:translateX(calc(-100% - 560px))}}
.hero{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.hero .pic{width:96px;height:120px;border-radius:10px;display:grid;place-items:center;font-size:44px;border:2px solid var(--line);background:#120f0c;position:relative;overflow:hidden}
.hero h2{margin:0;font-size:18px}.hero p{margin:2px 0;font-size:13px;color:var(--ink2)}.cp{font-size:26px;font-weight:900;color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:12px 0}
.tabs button{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 0;font-size:14px;color:var(--ink2)}
.tabs button[aria-pressed=true]{background:linear-gradient(#4a2416,#2a140c);border-color:var(--red);color:var(--ink);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h3{margin:0 0 4px;font-size:16px}.sub{color:var(--ink3);font-size:12.5px;margin:0 0 12px}
.btn{border:1px solid #6b4a20;background:linear-gradient(#5a3a16,#2e1d0b);border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,220,150,.2)}
.btn.red{border-color:#8a2a20;background:linear-gradient(#7d2218,#3e100b)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}.row .btn{flex:1}
.bar{height:8px;background:#0e0b09;border-radius:5px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a1a,var(--gold));transition:width .3s}
.mini{font-size:12.5px;color:var(--ink2)}
.pack{border:1px solid var(--line);border-top:3px solid var(--pc);border-radius:12px;padding:12px;margin-bottom:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 10%,transparent),transparent 60%)}.ph b{font-size:16px;color:var(--pc)}.ph small{display:block;color:var(--ink3);font-size:12px}.pr{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;margin:8px 0}.pack .btn{font-size:13.5px;padding:10px 8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cardS{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;background:#16120e;font-size:11.5px;position:relative}
.cardS .e{font-size:24px;display:block}.cardS .n{display:block;line-height:1.25;margin-top:2px}.cardS .c{position:absolute;top:2px;right:5px;font-size:11px;color:var(--gold)}
.cardS.off{opacity:.25;filter:grayscale(1)}.cardS.eq{box-shadow:0 0 0 2px var(--gold)}
.gsel{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}.gsel button{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:5px 11px;font-size:12.5px}.gsel button[aria-pressed=true]{border-color:currentColor;font-weight:700}
.log{margin-top:12px;max-height:180px;overflow:auto;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px}.log p{margin:3px 0}
.pt{width:100%;border-collapse:collapse;font-size:13px}.pt td{padding:5px 6px;border-bottom:1px solid var(--line)}.pt td:last-child{text-align:right;font-family:ui-monospace,Menlo,monospace}
.note{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
/* 연출 무대 */
.stage{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 45%,rgba(40,25,10,.6),rgba(0,0,0,.94));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden}
.stage.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,5px)}}
.stage .msg{font-size:15px;color:var(--ink2);min-height:22px;text-align:center}
.stage .skip{position:absolute;right:14px;bottom:18px;font-size:12px;color:var(--ink3);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.big{width:200px;height:280px;perspective:900px;position:relative}
.big .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.big.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.back{background:repeating-linear-gradient(45deg,#2a1d12 0 10px,#1d140c 10px 20px);border:3px solid var(--ac,#555);box-shadow:0 0 30px var(--ac,transparent),0 0 70px var(--ac,transparent),inset 0 0 30px var(--ac,transparent);transition:border-color .15s,box-shadow .15s}
.back::after{content:'♛';font-size:60px;color:rgba(224,176,74,.4)}
.big.tremble .in{animation:trem .12s infinite}
@keyframes trem{0%,100%{translate:0 0}25%{translate:-2px 1px}50%{translate:2px -1px}75%{translate:-1px -2px}}
.front{transform:rotateY(180deg);background:linear-gradient(160deg,#2b2118,#120e0b);border:3px solid var(--ac);box-shadow:0 0 40px var(--ac)}
.front .e{font-size:84px;filter:drop-shadow(0 0 12px var(--ac))}.front .g{font-size:13px;letter-spacing:.2em;color:var(--ac);font-weight:700}.front .n{font-size:20px;font-weight:900;text-align:center;padding:0 10px}
.beam{position:absolute;left:50%;top:-20%;width:240px;height:140%;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:0;filter:blur(8px);pointer-events:none}
.beam.on{animation:beam 1.6s ease-out}
@keyframes beam{0%{opacity:0;width:20px}20%{opacity:.85}100%{opacity:0;width:420px}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}.flash.on{animation:fl .5s ease-out}@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.multi{display:grid;grid-template-columns:repeat(4,64px);gap:8px;justify-content:center}
.mc{width:64px;height:90px;border-radius:8px;border:2px solid #444;background:repeating-linear-gradient(45deg,#2a1d12 0 6px,#1d140c 6px 12px);display:grid;place-items:center;font-size:30px;transition:all .25s}
.mc.open{background:linear-gradient(160deg,#2b2118,#120e0b);border-color:var(--ac);box-shadow:0 0 16px var(--ac)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--ac,#ffd27a);pointer-events:none;animation:sp .9s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.anvil{font-size:80px;position:relative}.hammer{position:absolute;top:-40px;right:-50px;font-size:56px;transform-origin:80% 80%;transform:rotate(-40deg)}.hammer.hit{animation:hit .28s ease-in}
@keyframes hit{0%{transform:rotate(-40deg)}60%{transform:rotate(25deg)}100%{transform:rotate(-40deg)}}
.wlv{font-size:34px;font-weight:900;color:var(--gold);text-shadow:0 0 18px rgba(224,176,74,.6)}
.orbit{position:relative;width:220px;height:220px}.orbit .mc{position:absolute;left:78px;top:65px;transition:transform 1.4s cubic-bezier(.6,0,.4,1),opacity .4s}
.gauge{width:240px}.gauge .bar{height:12px}
.crack{animation:crack .6s}@keyframes crack{0%{filter:none}30%{filter:brightness(2)}100%{filter:grayscale(1) brightness(.4);transform:scale(.9) rotate(-4deg)}}

.spr{display:inline-block;background-image:url(atlas.png);background-repeat:no-repeat;image-rendering:pixelated;vertical-align:middle;flex:0 0 auto}
.battle{position:relative;border:1px solid #4a3a22;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 30px -14px #000}
.battle canvas{display:block;width:100%;aspect-ratio:384/168;image-rendering:pixelated}
.hcp{position:absolute;right:10px;bottom:8px;font-weight:900;font-size:18px;color:var(--gold);text-shadow:0 0 8px #000,0 0 2px #000}
.heq{display:grid;grid-template-columns:1fr 1fr .8fr;gap:6px;margin-top:8px}
.eq{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gc,var(--gold));border-radius:10px;padding:6px}
.eq small{display:block;font-size:10.5px;color:var(--ink3)}.eq b{display:block;font-size:13px;line-height:1.2}.eq em{font-style:normal;font-size:11px}
.eq.w .wl{font-size:22px;font-weight:900;color:var(--gold);min-width:38px;text-align:center}
.reg h4{margin:12px 0 6px;font-size:13px;color:var(--gold);letter-spacing:.06em}
.zl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.zb{text-align:left;border:1px solid var(--line);background:#16120e;border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:2px}
.zb.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:#251a0e}.zb:disabled{opacity:.38}
.zb b{font-size:13px}.zb small{font-size:11px;color:var(--ink3)}.zm{display:flex;gap:1px}
.pool button{font-size:13.5px;padding:6px 14px}
.cardS{border-color:var(--gc)}.cardS .spr{display:block;margin:0 auto}
.pt tr.cur{background:#2a1d10}
.top .ic{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:15px}
.credit{font-size:10.5px;color:var(--ink3);margin-top:6px}

<script>/* 잿빛 왕관 · 시제품 v2 — 그림: Dungeon Crawl Stone Soup 타일 (CC0, 퍼블릭 도메인) */
const $=id=>document.getElementById(id);const rnd=Math.random;const R=(a,b)=>a+Math.floor(rnd()*(b-a+1));const pick=a=>a[Math.floor(rnd()*a.length)];const wait=ms=>new Promise(r=>setTimeout(r,ms));
const G=[{ko:'일반',c:'#b8b8b8'},{ko:'고급',c:'#5fcf6e'},{ko:'희귀',c:'#4aa3ff'},{ko:'영웅',c:'#ff4d4d'},{ko:'전설',c:'#ffb22e'},{ko:'신화',c:'#d77bff'}];
const POW=[30,90,260,700,1800,5000];
const CARDS=[...ATL.T.map(([f,n,g,i])=>({id:'t:'+f,ty:'t',n,g,i})),...ATL.D.map(([f,n,g,i])=>({id:'d:'+f,ty:'d',n,g,i}))];
const C=id=>CARDS.find(c=>c.id===id);
const ZONES=ATL.Z.map(([n,reg,fl,mons],i)=>({n,reg,fl,mons,need:i?Math.round(120*Math.pow(1.19,i)):0,m:1+i*.4,lv:i+1}));
const PACKS=[{k:'normal',ko:'일반 패키지',d:'골드로 살 수 있는 기본 소환',cur:'gold',p1:5000,p11:50000,rates:[.62,.28,.08,.02,0,0],pity:0,c:'#a8a8a8'},
 {k:'silver',ko:'실버 패키지',d:'고급부터 시작 · 영웅까지',cur:'won',p1:3300,p11:33000,rates:[0,.75,.21,.04,0,0],pity:30,pg:3,c:'#c9d3dc'},
 {k:'goldp',ko:'골드 패키지',d:'고급부터 시작 · 전설까지',cur:'won',p1:11000,p11:110000,rates:[0,.5,.34,.135,.025,0],pity:80,pg:4,c:'#ffcf5a'}];
const ENH=[1,1,1,1,.9,.8,.6,.4,.25,.15,.09,.05,.03,.02,.01];const SYN=[.25,.15,.08,.03,.01];const SYN_PITY=100;
/* ---------- 그림 ---------- */
const AW=ATL.cols*32,AH=ATL.rows*32;const IMG=new Image();IMG.src='atlas.png';
function spr(i,px,extra){const k=px/32,cx=i%ATL.cols,cy=Math.floor(i/ATL.cols);return`<i class="spr" style="width:${px}px;height:${px}px;background-size:${AW*k}px ${AH*k}px;background-position:${-cx*32*k}px ${-cy*32*k}px;${extra||''}"></i>`}
/* ---------- 저장 ---------- */
let S=load();
function load(){let x=null;try{x=JSON.parse(localStorage.getItem('ash.v2'))}catch(_){}if(!x)x={gold:200000,scroll:30,bless:3,cards:{'t:goblin_new':1,'d:rat':1},eqT:'t:goblin_new',eqD:'d:rat',wlv:0,best:0,spts:{},t:Date.now(),log:[],hz:0,spent:0,pp:{},kills:0};return x}
function save(){try{localStorage.setItem('ash.v2',JSON.stringify(S))}catch(_){}}
function power(){const t=C(S.eqT),d=C(S.eqD);let p=100+(t?POW[t.g]:0)+(d?Math.round(POW[d.g]*.6):0)+Math.round(40*Math.pow(1.38,S.wlv));for(const c of CARDS)if(S.cards[c.id])p+=Math.round(POW[c.g]*(c.ty==='t'?.12:.08));return p}
/* ---------- 소리 ---------- */
let AC=null;function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(_){}return AC}
function tone(f,d=.15,type='sine',v=.12,delay=0,slide=0){const a=AC;if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={tick:g=>tone(300+g*120,.08,'triangle',.08),up:g=>tone(420+g*160,.18,'square',.06),flip:()=>tone(180,.25,'sawtooth',.05,0,2.5),

 legend:()=>{[0,4,7,12,16,19,24].forEach((s,i)=>tone(392*Math.pow(2,s/12),.5,'square',.07,i*.11));tone(60,1.2,'sine',.25,0,.5)},
 hit:()=>{tone(900,.06,'square',.1);tone(140,.18,'sawtooth',.12,0,.4)},fail:()=>tone(220,.5,'sawtooth',.1,0,.3),boom:()=>{tone(80,.9,'sawtooth',.2,0,.3);tone(40,1,'sine',.3)},hum:()=>tone(70,1.6,'sine',.12,0,1.6),

const BW=384,BH=168,BS=1.5;let mobs=[],fx=[],btT=0,nextSpawn=0,lastT=0;
function zone(){return ZONES[S.hz||0]}
function spawn(){const z=zone(),i=pick(z.mons);const hp=Math.round(60*z.lv*(.8+rnd()*.5));mobs.push({i,x:BW+20,y:R(84,112),hp,max:hp,atk:0,dead:0,hit:0})}
function battle(t){const cv=$('bt');if(!cv)return;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;const dt=Math.min(64,t-(lastT||t));lastT=t;
 const z=zone();const fx_=z.fl%ATL.cols*32,fy=Math.floor(z.fl/ATL.cols)*32,ts=32*BS;
 if(IMG.complete)for(let y=0;y<BH;y+=ts)for(let x=0;x<BW;x+=ts)c.drawImage(IMG,fx_,fy,32,32,x,y,ts,ts);

 const busy=!$('stage').hidden;
 if(!busy){if(t>nextSpawn&&mobs.filter(m=>!m.dead).length<3){spawn();nextSpawn=t+R(900,1800)}}
 const px=78,py=108;const me=C(S.eqT),dl=C(S.eqD);const near=mobs.find(m=>!m.dead&&m.x<px+60);
 const atkPhase=(t%650)/650;const swing=near&&atkPhase<.2;
 const draw=(i,x,y,s,flip,alpha)=>{if(!IMG.complete)return;c.save();c.globalAlpha=alpha==null?1:alpha;if(flip){c.translate(x+32*s,y);c.scale(-1,1);x=0;y=0}c.drawImage(IMG,(i%ATL.cols)*32,Math.floor(i/ATL.cols)*32,32,32,x,y,32*s,32*s);c.restore()};
 // 인형

 // 나
 const lunge=swing?8:0;c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(px+24,py+50,22,6,0,0,7);c.fill();if(me)draw(me.i,px+lunge,py-4+Math.sin(t/300)*1.5,2,false);
 // 몬스터
 for(const m of mobs){if(!m.dead){const target=px+52+mobs.filter(o=>!o.dead&&o!==m&&o.x<m.x).length*34;if(m.x>target)m.x-=dt*.06;}
  const a=m.dead?Math.max(0,1-(t-m.dead)/500):1;c.fillStyle=`rgba(0,0,0,${.35*a})`;c.beginPath();c.ellipse(m.x+22,m.y+44,18,5,0,0,7);c.fill();
  draw(m.i,m.x+(m.hit>t?R(-2,2):0),m.y-(m.dead?(t-m.dead)/12:0),1.5,true,a);
  if(!m.dead){c.fillStyle='#200';c.fillRect(m.x+4,m.y-6,40,4);c.fillStyle='#d33';c.fillRect(m.x+4,m.y-6,40*m.hp/m.max,4)}}
 // 공격
 if(near&&!busy){btT+=dt;const dps=power()/(6+z.lv*1.4);if(btT>650){btT=0;const crit=rnd()<.12;const dmg=Math.max(1,Math.round(dps*(crit?2.2:1)*(.85+rnd()*.3)));near.hp-=dmg;near.hit=t+150;
   fx.push({k:'num',x:near.x+20,y:near.y,t,txt:(crit?'치명 ':'')+dmg,c:crit?'#ffd23a':'#fff'});fx.push({k:'sl',x:near.x+10,y:near.y+10,t});if(!MUTE)sfx.slash();
   if(near.hp<=0){near.dead=t;S.kills++;const g=Math.round(z.m*power()/25*(.8+rnd()*.4));S.gold+=g;fx.push({k:'gold',x:near.x+12,y:near.y+20,t,txt:'+'+g.toLocaleString()});if(!MUTE)sfx.coin();
    if(rnd()<.06){S.scroll++;fx.push({k:'scroll',x:near.x+16,y:near.y,t})}if(rnd()<.004){S.bless++;fx.push({k:'num',x:near.x,y:near.y-10,t,txt:'축복 주문서!',c:'#9fe3ff'})}
    if(S.kills%25===0)save();headLite()}}}

  if(f.k==='sl'&&age<160){c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=3;c.beginPath();c.arc(f.x+12,f.y+12,18+age/12,-1.2,.6);c.stroke()}
  if(f.k==='gold'){const a=Math.max(0,1-age/1100);c.globalAlpha=a;if(ATL.X.gold_pile_10!=null)draw(ATL.X.gold_pile_10,f.x,f.y-age/30,1);c.font='bold 12px sans-serif';c.fillStyle='#ffd23a';c.fillText(f.txt,f.x+30,f.y+18-age/30);c.globalAlpha=1}
  if(f.k==='scroll'){c.globalAlpha=Math.max(0,1-age/1200);if(ATL.X.scroll!=null)draw(ATL.X.scroll,f.x,f.y-age/20,1);c.globalAlpha=1}}

let TAB='hunt',POOL='t',SG=0;
function headLite(){$('cur').innerHTML=`<span>골드 <b>${S.gold.toLocaleString()}</b></span><span>주문서 <b>${S.scroll}</b></span><span>축복 <b>${S.bless}</b></span>`;$('hcp').textContent=`전투력 ${power().toLocaleString()}`}
function head(){headLite();const t=C(S.eqT),d=C(S.eqD);$('heq').innerHTML=`<div class="eq" style="--gc:${G[t.g].c}">${spr(t.i,56)}<div><small>변신</small><b>${t.n}</b><em style="color:${G[t.g].c}">${G[t.g].ko}</em></div></div><div class="eq" style="--gc:${G[d.g].c}">${spr(d.i,56)}<div><small>인형</small><b>${d.n}</b><em style="color:${G[d.g].c}">${G[d.g].ko}</em></div></div><div class="eq w"><div class="wl">+${S.wlv}</div><div><small>무기</small><b>잿빛 장검</b><em>최고 +${S.best}</em></div></div>`}
function render(){head();for(const b of $('tabs').children)b.setAttribute('aria-pressed',b.dataset.t===TAB);$('body').innerHTML=({hunt:vHunt,gacha:vGacha,synth:vSynth,enh:vEnh,book:vBook})[TAB]()}
const poolSel=()=>`<div class="gsel pool"><button data-pool="t" aria-pressed="${POOL==='t'}">변신 카드</button><button data-pool="d" aria-pressed="${POOL==='d'}">인형 카드</button></div>`;
function vHunt(){const p=power();const regs=[...new Set(ZONES.map(z=>z.reg))];return`<h3>사냥터 · 에르덴 대륙</h3><p class="sub">전투력이 오르면 더 깊은 곳이 열립니다. 깊을수록 몬스터 한 마리당 골드가 많아요. 창을 닫아도 최대 12시간 동안 사냥이 계속됩니다.</p>
 ${regs.map(r=>`<div class="reg"><h4>${r}</h4><div class="zl">${ZONES.map((z,i)=>z.reg!==r?'':`<button class="zb${i===S.hz?' on':''}" data-hz="${i}" ${p<z.need?'disabled':''}><span class="zm">${z.mons.map(m=>spr(m,28)).join('')}</span><b>Lv.${z.lv} ${z.n}</b><small>${p<z.need?`전투력 ${z.need.toLocaleString()} 필요`:`골드 ×${z.m.toFixed(1)}`}</small></button>`).join('')}</div></div>`).join('')}`}
function vGacha(){return`<h3>소환</h3>${poolSel()}<p class="sub">현금 패키지는 시제품이라 실제 결제가 일어나지 않아요. 대신 가상 결제 누적에 쌓입니다. <b>누적 ₩${S.spent.toLocaleString()}</b></p>
 ${PACKS.map(P=>{const key=P.k+POOL,pc=P.pity?(S.pp[key]||0):0,price=n=>P.cur==='gold'?`${(n===1?P.p1:P.p11).toLocaleString()} 골드`:`₩${(n===1?P.p1:P.p11).toLocaleString()}`,dis=n=>P.cur==='gold'&&S.gold<(n===1?P.p1:P.p11);
 return`<div class="pack" style="--pc:${P.c}"><div class="ph"><b>${P.ko}</b><small>${P.d} · ${POOL==='t'?'변신':'인형'}</small></div>
  <div class="pr">${G.map((g,i)=>P.rates[i]?`<span style="color:${g.c}">${g.ko} ${(P.rates[i]*100).toFixed(P.rates[i]<.1?1:0)}%</span>`:'').join('')}</div>
  ${P.pity?`<p class="mini">${G[P.pg].ko} 확정까지 <b style="color:${G[P.pg].c}">${P.pity-pc}</b>회</p><div class="bar" style="margin:4px 0 8px"><i style="width:${pc/P.pity*100}%"></i></div>`:''}
  <div class="row"><button class="btn" data-pk="${P.k}" data-n="1" ${dis(1)?'disabled':''}>1회 · ${price(1)}</button><button class="btn red" data-pk="${P.k}" data-n="11" ${dis(11)?'disabled':''}>11회 · ${price(11)}</button></div></div>`}).join('')}`}
function vSynth(){const g=SG;const have=CARDS.filter(c=>c.ty===POOL&&c.g===g).reduce((a,c)=>a+(S.cards[c.id]||0),0);const sp=S.spts[POOL+g]||0;
 return`<h3>합성</h3>${poolSel()}<p class="sub">같은 등급 4장으로 다음 등급에 도전합니다. 실패하면 1장이 돌아오고 합성 포인트가 쌓여요. 100점이면 확정 성공.</p>
 <div class="gsel">${G.slice(0,5).map((x,i)=>`<button data-sg="${i}" style="color:${x.c}" aria-pressed="${i===g}">${x.ko}</button>`).join('')}</div>
 <p class="mini">가진 ${G[g].ko} 카드 <b>${have}</b>장 · 성공 확률 <b style="color:${G[g+1].c}">${(SYN[g]*100).toFixed(0)}%</b> → ${G[g+1].ko}</p>
 <div class="bar" style="margin:8px 0 4px"><i style="width:${sp/SYN_PITY*100}%"></i></div><p class="mini">합성 포인트 ${sp} / ${SYN_PITY}</p>
 <button class="btn red" style="width:100%;margin-top:8px" data-act="syn" ${have<4?'disabled':''}>4장 합성하기</button>`}
function vEnh(){const lv=S.wlv,p=ENH[lv];return`<h3>무기 강화 · 잿빛 장검</h3><p class="sub">+7부터 실패하면 무기가 <b style="color:#ff6b6b">파괴</b>됩니다(+0). 축복 주문서는 실패해도 한 단계만 내려가요.</p>
 <div style="text-align:center;margin:8px 0"><div class="wlv">+${lv}</div><p class="mini">다음 단계 성공 확률 <b style="color:var(--gold)">${lv>=15?'-':(p*100).toFixed(0)+'%'}</b> · 실패하면 ${lv<7?'그대로':'파괴'} · 최고 기록 +${S.best}</p></div>
 <div class="row"><button class="btn" data-act="enh" ${S.scroll<1||lv>=15?'disabled':''}>강화 (주문서 1)</button><button class="btn red" data-act="benh" ${S.bless<1||lv>=15?'disabled':''}>축복 강화 (축복 1)</button></div>
 <table class="pt" style="margin-top:14px">${ENH.map((x,i)=>i>=4?`<tr${i===lv?' class="cur"':''}><td>+${i} → +${i+1}</td><td>${(x*100).toFixed(0)}%</td></tr>`:'').join('')}</table>`}
function vBook(){const L=CARDS.filter(c=>c.ty===POOL);const own=L.filter(c=>S.cards[c.id]).length;return`<h3>도감 · ${own} / ${L.length}</h3>${poolSel()}<p class="sub">모은 카드마다 전투력이 오릅니다. 가진 카드를 누르면 장착합니다.</p>
 <div class="grid">${L.map(c=>`<div class="cardS${S.cards[c.id]?'':' off'}${(S.eqT===c.id||S.eqD===c.id)?' eq':''}" data-eq="${c.id}" style="--gc:${G[c.g].c}"><span class="c">${S.cards[c.id]?'×'+S.cards[c.id]:''}</span>${spr(c.i,48)}<span class="n">${c.n}</span></div>`).join('')}</div>`}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;TAB=b.dataset.t;render()};
$('mute').onclick=()=>{MUTE=!MUTE;$('mute').textContent=MUTE?'🔇':'🔊'};
$('body').onclick=e=>{ac();const t=e.target;const q=s=>t.closest(s);
 const pl=q('[data-pool]');if(pl){POOL=pl.dataset.pool;render();return}
 const hz=q('[data-hz]');if(hz&&!hz.disabled){S.hz=+hz.dataset.hz;mobs=[];save();render();return}
 const sg=q('[data-sg]');if(sg){SG=+sg.dataset.sg;render();return}
 const eq=q('[data-eq]');if(eq){const id=eq.dataset.eq;if(S.cards[id]){if(id.startsWith('t:'))S.eqT=id;else S.eqD=id;save();render()}return}
 if(BUSY)return;const pk=q('[data-pk]');const a=q('[data-act]');let job=null;
 if(pk&&!pk.disabled)job=buyPack(pk.dataset.pk,+pk.dataset.n);else if(a&&!a.disabled)job=({syn:synth,enh:()=>enhance(false),benh:()=>enhance(true)})[a.dataset.act]();
 if(job)Promise.resolve(job).catch(()=>{}).finally(()=>{if(BUSY)stageOff()})};
/* ---------- 연출 공통 ---------- */
let BUSY=false,SKIP=false;
function stageOn(html){const s=$('stage');s.innerHTML=html+'<button class="skip" id="skip">빠르게 ▸▸</button>';s.hidden=false;SKIP=false;$('skip').onclick=()=>{SKIP=true};return s}
function stageOff(){$('stage').hidden=true;$('stage').innerHTML='';BUSY=false;save();render()}
const W=ms=>SKIP?wait(Math.min(ms,60)):wait(ms);
const S_=fn=>{if(!MUTE)fn()};
function sparks(el,n,color){if(!el)return;const r=el.getBoundingClientRect(),st=$('stage');for(let i=0;i<n;i++){const s=document.createElement('i');s.className='spark';const a=rnd()*Math.PI*2,d=60+rnd()*160;s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');if(color)s.style.background=color;st.appendChild(s);setTimeout(()=>s.remove(),950)}}
function flash(){const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function shake(){const s=$('stage');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}
/* ---------- 소환 ---------- */
function rollPack(P,ty){const key=P.k+ty;const pc=(S.pp[key]||0)+1;let g;if(P.pity&&pc>=P.pity){g=P.pg;S.pp[key]=0}else{let x=rnd(),acc=0;g=P.rates.findIndex(r=>(acc+=r)>x);if(g<0)g=1;if(P.pity)S.pp[key]=g>=P.pg?0:pc}
 const L=CARDS.filter(c=>c.ty===ty&&c.g===g);const c=pick(L);S.cards[c.id]=(S.cards[c.id]||0)+1;return c}
async function buyPack(k,n){const P=PACKS.find(x=>x.k===k);const cost=n===1?P.p1:P.p11;if(P.cur==='gold'){if(S.gold<cost)return;S.gold-=cost}else S.spent+=cost;BUSY=true;const res=[];for(let i=0;i<n;i++)res.push(rollPack(P,POOL));save();
 if(n===1){await revealOne(res[0],true);stageOff();return}await revealMany(res);stageOff()}
async function revealOne(c,big){const g=c.g;stageOn(`<div class="msg" id="msg">${big?'카드가 떨립니다…':''}</div><div class="big tremble" id="bc"><div class="beam" id="beam" style="--ac:${G[g].c}"></div><div class="in"><div class="face back" id="back"></div><div class="face front" style="--ac:${G[g].c}"><span class="g">${G[g].ko} · ${c.ty==='t'?'변신':'인형'}</span>${spr(c.i,128,'filter:drop-shadow(0 0 14px '+G[g].c+')')}<span class="n">${c.n}</span></div></div></div>`);
 const back=$('back'),bc=$('bc');S_(sfx.hum);await W(500);
 const fake=g>=3&&rnd()<.55,tease=g<=1&&rnd()<.22,top=fake?g-1:g;
 for(let i=0;i<=Math.max(top,tease?g+1:0);i++){back.style.setProperty('--ac',G[i].c);S_(()=>sfx.up(i));if(i>=2)buzz(20);await W(260+i*160)}
 if(tease){$('msg').textContent='…!';await W(500);back.style.setProperty('--ac',G[g].c);S_(sfx.fail);$('msg').textContent='아쉽게도…';await W(450)}
 if(fake){$('msg').textContent='…';await W(900);flash();shake();S_(sfx.boom);back.style.setProperty('--ac',G[g].c);$('msg').innerHTML=`<b style="color:${G[g].c}">빛이 한 번 더 솟구칩니다!</b>`;buzz([60,40,120]);await W(800)}
 if(g>=4){$('msg').innerHTML=`<b style="color:${G[g].c}">${G[g].ko}의 기운!</b>`;await W(900)}
 bc.classList.remove('tremble');bc.classList.add('flip');S_(sfx.flip);await W(350);
 if(g>=2){sparks(bc,g*14,G[g].c);S_(()=>sfx.rare(g))}if(g>=3){$('beam').classList.add('on');flash();shake()}if(g>=4){S_(sfx.legend);buzz([100,60,200,60,300]);sparks(bc,80,G[g].c)}
 $('msg').innerHTML=`<b style="color:${G[g].c}">${G[g].ko}</b> · ${c.n}`;if(g>=3)announce(`<span style="color:${G[g].c}">★ 당신이 ${G[g].ko} 「${c.n}」 ${c.ty==='t'?'변신':'인형'}을 손에 넣었습니다!</span>`);await wait(g>=4?2200:g>=2?1300:900)}
async function revealMany(res){const order=res.map((c,i)=>i).sort((a,b)=>res[a].g-res[b].g);const best=order.pop();
 stageOn(`<div class="msg" id="msg">11장의 카드가 펼쳐집니다</div><div class="multi">${res.map((c,i)=>`<div class="mc" id="m${i}"></div>`).join('')}</div>`);S_(sfx.hum);await W(600);
 for(const i of order){const c=res[i],el=$('m'+i);el.style.setProperty('--ac',G[c.g].c);el.classList.add('open');el.innerHTML=spr(c.i,48);S_(()=>sfx.tick(c.g));if(c.g>=2)sparks(el,10,G[c.g].c);await W(c.g>=2?380:170)}
 $('msg').innerHTML='<b>마지막 한 장…</b>';$('m'+best).classList.add('tremble');await W(900);await revealOne(res[best],false);
 const top=res.reduce((a,c)=>Math.max(a,c.g),0);if(top<3)announce(`11회 소환 · 최고 등급 <span style="color:${G[top].c}">${G[top].ko}</span>`)}
/* ---------- 합성 ---------- */
function takeCards(ty,g,n){const L=[];const pool=CARDS.filter(c=>c.ty===ty&&c.g===g);while(L.length<n){const c=pool.filter(x=>(S.cards[x.id]||0)>0).sort((a,b)=>(S.cards[b.id]||0)-(S.cards[a.id]||0))[0];if(!c)break;S.cards[c.id]--;if(!S.cards[c.id])delete S.cards[c.id];L.push(c)}return L}
function fixEq(){if(!S.cards[S.eqT])S.eqT=CARDS.find(c=>c.ty==='t'&&S.cards[c.id]).id;if(!S.cards[S.eqD])S.eqD=(CARDS.find(c=>c.ty==='d'&&S.cards[c.id])||{id:S.eqD}).id}
async function synth(){const g=SG,ty=POOL;const ins=takeCards(ty,g,4);if(ins.length<4){ins.forEach(c=>S.cards[c.id]=(S.cards[c.id]||0)+1);return}BUSY=true;const key=ty+g;
 const sure=(S.spts[key]||0)>=SYN_PITY;const ok=sure||rnd()<SYN[g];
 stageOn(`<div class="msg" id="msg">${G[g].ko} 카드 4장을 제단에 올립니다</div><div class="orbit" id="orb">${ins.map((c,i)=>`<div class="mc open" id="o${i}" style="--ac:${G[g].c};transform:rotate(${i*90}deg) translateY(-80px) rotate(-${i*90}deg)">${spr(c.i,48)}</div>`).join('')}</div><div class="gauge"><div class="bar"><i id="gg" style="width:0"></i></div></div>`);
 S_(sfx.hum);await W(400);for(let i=0;i<4;i++){$('o'+i).style.transform='translate(0,0) scale(.6)';$('o'+i).style.opacity='.85'}
 let w=0;const target=ok?100:R(62,96);while(w<target){w=Math.min(target,w+R(4,11));$('gg').style.width=w+'%';S_(()=>sfx.tick(Math.floor(w/25)));await W(90)}
 if(!ok)await W(700);
 if(ok){const c=pick(CARDS.filter(x=>x.ty===ty&&x.g===g+1));S.cards[c.id]=(S.cards[c.id]||0)+1;if(sure)S.spts[key]=0;fixEq();flash();shake();S_(sfx.boom);sparks($('orb'),60,G[g+1].c);await W(500);await revealOne(c,false)}
 else{const back=pick(ins);S.cards[back.id]=(S.cards[back.id]||0)+1;S.spts[key]=Math.min(SYN_PITY,(S.spts[key]||0)+R(8,15));fixEq();for(let i=0;i<4;i++)$('o'+i).classList.add('crack');S_(sfx.fail);buzz(200);
  $('msg').innerHTML=`합성 실패 · 「${back.n}」 1장이 돌아왔습니다<br><span class="mini">합성 포인트 ${S.spts[key]} / ${SYN_PITY}</span>`;await wait(1800)}
 stageOff()}
/* ---------- 강화 ---------- */
async function enhance(bl){if(bl?S.bless<1:S.scroll<1)return;BUSY=true;if(bl)S.bless--;else S.scroll--;const lv=S.wlv,ok=rnd()<ENH[lv];
 stageOn(`<div class="msg" id="msg">잿빛 장검 +${lv} 강화를 시작합니다${bl?' · 축복':''}</div><div class="anvil" id="anv">🗡️<span class="hammer" id="ham">🔨</span></div><div class="wlv" id="wl">+${lv}</div>`);
 const gap=lv>=7?700:380;for(let i=0;i<3;i++){await W(i===2&&lv>=7?gap*1.8:gap);$('ham').classList.remove('hit');void $('ham').offsetWidth;$('ham').classList.add('hit');S_(sfx.hit);sparks($('anv'),8+i*6,'#ffcf6a');if(lv>=9)buzz(30)}
 await W(lv>=9?900:300);
 if(ok){S.wlv++;S.best=Math.max(S.best,S.wlv);flash();S_(()=>sfx.rare(Math.min(5,Math.floor(S.wlv/3))));sparks($('anv'),30+S.wlv*4,'#ffd27a');$('wl').textContent='+'+S.wlv;$('msg').innerHTML='<b style="color:var(--gold)">강화 성공!</b>';if(S.wlv>=9){shake();S_(sfx.legend);buzz([80,50,160]);announce(`<span style="color:#ffb22e">★ 당신이 잿빛 장검 +${S.wlv} 강화에 성공했습니다!</span>`)}}
 else if(lv<7){S_(sfx.fail);$('msg').textContent='강화 실패 · 아무 일도 일어나지 않았습니다'}
 else if(bl){S.wlv=Math.max(0,lv-1);S_(sfx.fail);buzz(200);$('wl').textContent='+'+S.wlv;$('msg').innerHTML='축복의 힘으로 파괴는 면했습니다 · 한 단계 하락'}
 else{S.wlv=0;S_(sfx.boom);shake();buzz([300,80,300]);$('anv').classList.add('crack');$('wl').textContent='+0';$('msg').innerHTML=`<b style="color:#ff6b6b">무기가 산산조각 났습니다</b><br><span class="mini">+${lv}의 잿빛 장검은 재가 되었습니다</span>`;if(lv>=9)announce(`<span style="color:#ff6b6b">✝ 당신의 잿빛 장검 +${lv}이(가) 파괴되었습니다…</span>`)}
 await wait(ok&&S.wlv>=9?2200:1600);stageOff()}
/* ---------- 자리 비운 사이 ---------- */
{const away=Math.min(12*3600,Math.floor((Date.now()-(S.t||Date.now()))/1000));if(away>60){const z=zone();const kills=Math.floor(away/2.2);const g=Math.round(kills*z.m*power()/25*.6);S.gold+=g;S.kills+=kills;S.scroll+=Math.floor(kills*.03);setTimeout(()=>announce(`자리를 비운 ${Math.round(away/60)}분 동안 ${z.n}에서 ${kills.toLocaleString()}마리를 잡고 골드 ${g.toLocaleString()}을 모았습니다`),700)}}
setInterval(()=>{S.t=Date.now();save()},10000);addEventListener('pagehide',()=>{S.t=Date.now();save()});
render();requestAnimationFrame(loop);
</script></body></html>
