<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>잿빛 왕관 · 시제품</title><script data-goatcounter="https://alohang1985.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b0a;--bg2:#17130f;--card:#1f1a15;--line:#3a3027;--ink:#efe4cf;--ink2:#b9ab92;--ink3:#7d705d;--gold:#e0b04a;--red:#c4372b;
 --g0:#b8b8b8;--g1:#5fcf6e;--g2:#4aa3ff;--g3:#ff4d4d;--g4:#ffb22e;--g5:#d77bff}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a1d12,transparent),var(--bg);color:var(--ink);font-family:'Noto Serif KR',serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:12px 14px 90px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-weight:900;font-size:22px;letter-spacing:.04em;color:var(--gold);text-shadow:0 0 18px rgba(224,176,74,.35)}
.logo small{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.2em;font-weight:500}
.cur{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.cur span{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap}.cur b{color:var(--gold)}
.ticker{margin:10px 0;border:1px solid #4a3a22;background:linear-gradient(90deg,#1c140b,#120e0a);border-radius:8px;height:30px;overflow:hidden;position:relative;font-size:13px}
.ticker div{position:absolute;white-space:nowrap;top:5px;left:100%;animation:tick 14s linear}
@keyframes tick{to{transform:translateX(calc(-100% - 560px))}}
.hero{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.hero .pic{width:96px;height:120px;border-radius:10px;display:grid;place-items:center;font-size:44px;border:2px solid var(--line);background:#120f0c;position:relative;overflow:hidden}
.hero h2{margin:0;font-size:18px}.hero p{margin:2px 0;font-size:13px;color:var(--ink2)}.cp{font-size:26px;font-weight:900;color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:12px 0}
.tabs button{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 0;font-size:14px;color:var(--ink2)}
.tabs button[aria-pressed=true]{background:linear-gradient(#4a2416,#2a140c);border-color:var(--red);color:var(--ink);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h3{margin:0 0 4px;font-size:16px}.sub{color:var(--ink3);font-size:12.5px;margin:0 0 12px}
.btn{border:1px solid #6b4a20;background:linear-gradient(#5a3a16,#2e1d0b);border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,220,150,.2)}
.btn.red{border-color:#8a2a20;background:linear-gradient(#7d2218,#3e100b)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px}.row .btn{flex:1}
.bar{height:8px;background:#0e0b09;border-radius:5px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a1a,var(--gold));transition:width .3s}
.mini{font-size:12.5px;color:var(--ink2)}
.pack{border:1px solid var(--line);border-top:3px solid var(--pc);border-radius:12px;padding:12px;margin-bottom:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 10%,transparent),transparent 60%)}.ph b{font-size:16px;color:var(--pc)}.ph small{display:block;color:var(--ink3);font-size:12px}.pr{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;margin:8px 0}.pack .btn{font-size:13.5px;padding:10px 8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cardS{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;background:#16120e;font-size:11.5px;position:relative}
.cardS .e{font-size:24px;display:block}.cardS .n{display:block;line-height:1.25;margin-top:2px}.cardS .c{position:absolute;top:2px;right:5px;font-size:11px;color:var(--gold)}
.cardS.off{opacity:.25;filter:grayscale(1)}.cardS.eq{box-shadow:0 0 0 2px var(--gold)}
.gsel{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}.gsel button{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:5px 11px;font-size:12.5px}.gsel button[aria-pressed=true]{border-color:currentColor;font-weight:700}
.log{margin-top:12px;max-height:180px;overflow:auto;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px}.log p{margin:3px 0}
.pt{width:100%;border-collapse:collapse;font-size:13px}.pt td{padding:5px 6px;border-bottom:1px solid var(--line)}.pt td:last-child{text-align:right;font-family:ui-monospace,Menlo,monospace}
.note{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
/* 연출 무대 */
.stage{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 45%,rgba(40,25,10,.6),rgba(0,0,0,.94));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden}
.stage.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,5px)}}
.stage .msg{font-size:15px;color:var(--ink2);min-height:22px;text-align:center}
.stage .skip{position:absolute;right:14px;bottom:18px;font-size:12px;color:var(--ink3);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.big{width:200px;height:280px;perspective:900px;position:relative}
.big .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.big.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.back{background:repeating-linear-gradient(45deg,#2a1d12 0 10px,#1d140c 10px 20px);border:3px solid var(--ac,#555);box-shadow:0 0 30px var(--ac,transparent),0 0 70px var(--ac,transparent),inset 0 0 30px var(--ac,transparent);transition:border-color .15s,box-shadow .15s}
.back::after{content:'♛';font-size:60px;color:rgba(224,176,74,.4)}
.big.tremble .in{animation:trem .12s infinite}
@keyframes trem{0%,100%{translate:0 0}25%{translate:-2px 1px}50%{translate:2px -1px}75%{translate:-1px -2px}}
.front{transform:rotateY(180deg);background:linear-gradient(160deg,#2b2118,#120e0b);border:3px solid var(--ac);box-shadow:0 0 40px var(--ac)}
.front .e{font-size:84px;filter:drop-shadow(0 0 12px var(--ac))}.front .g{font-size:13px;letter-spacing:.2em;color:var(--ac);font-weight:700}.front .n{font-size:20px;font-weight:900;text-align:center;padding:0 10px}
.beam{position:absolute;left:50%;top:-20%;width:240px;height:140%;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:0;filter:blur(8px);pointer-events:none}
.beam.on{animation:beam 1.6s ease-out}
@keyframes beam{0%{opacity:0;width:20px}20%{opacity:.85}100%{opacity:0;width:420px}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}.flash.on{animation:fl .5s ease-out}@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.multi{display:grid;grid-template-columns:repeat(4,64px);gap:8px;justify-content:center}
.mc{width:64px;height:90px;border-radius:8px;border:2px solid #444;background:repeating-linear-gradient(45deg,#2a1d12 0 6px,#1d140c 6px 12px);display:grid;place-items:center;font-size:30px;transition:all .25s}
.mc.open{background:linear-gradient(160deg,#2b2118,#120e0b);border-color:var(--ac);box-shadow:0 0 16px var(--ac)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--ac,#ffd27a);pointer-events:none;animation:sp .9s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.anvil{font-size:80px;position:relative}.hammer{position:absolute;top:-40px;right:-50px;font-size:56px;transform-origin:80% 80%;transform:rotate(-40deg)}.hammer.hit{animation:hit .28s ease-in}
@keyframes hit{0%{transform:rotate(-40deg)}60%{transform:rotate(25deg)}100%{transform:rotate(-40deg)}}
.wlv{font-size:34px;font-weight:900;color:var(--gold);text-shadow:0 0 18px rgba(224,176,74,.6)}
.orbit{position:relative;width:220px;height:220px}.orbit .mc{position:absolute;left:78px;top:65px;transition:transform 1.4s cubic-bezier(.6,0,.4,1),opacity .4s}
.gauge{width:240px}.gauge .bar{height:12px}
.crack{animation:crack .6s}@keyframes crack{0%{filter:none}30%{filter:brightness(2)}100%{filter:grayscale(1) brightness(.4);transform:scale(.9) rotate(-4deg)}}

.spr{display:inline-block;background-image:url(atlas.png);background-repeat:no-repeat;image-rendering:pixelated;vertical-align:middle;flex:0 0 auto}
.battle{position:relative;border:1px solid #4a3a22;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 30px -14px #000}
.battle canvas{display:block;width:100%;aspect-ratio:384/168;image-rendering:pixelated}
.hcp{position:absolute;right:10px;bottom:8px;font-weight:900;font-size:18px;color:var(--gold);text-shadow:0 0 8px #000,0 0 2px #000}
.heq{display:grid;grid-template-columns:1fr 1fr 1fr .8fr;gap:6px;margin-top:8px}.eq{cursor:pointer}.eq.offm{opacity:.55}.eq.ch{border-left-color:var(--gold)}
.cls{max-width:520px;width:100%;padding:16px;overflow:auto;max-height:100vh}.cls h2{color:var(--gold);margin:0 0 4px;text-align:center}.cls .mini{text-align:center}.clg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.clg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}.clg button.on{border-color:var(--gold)}.clg b{font-size:13px}.clg small{font-size:10.5px;color:var(--ink3);line-height:1.3;text-align:center}
@media (max-width:440px){.heq{grid-template-columns:1fr 1fr}.eq .spr{width:44px!important;height:44px!important}}
.eq{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gc,var(--gold));border-radius:10px;padding:6px}
.eq small{display:block;font-size:10.5px;color:var(--ink3)}.eq b{display:block;font-size:13px;line-height:1.2}.eq em{font-style:normal;font-size:11px}
.eq.w .wl{font-size:22px;font-weight:900;color:var(--gold);min-width:38px;text-align:center}
.reg h4{margin:12px 0 6px;font-size:13px;color:var(--gold);letter-spacing:.06em}
.zl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.zb{text-align:left;border:1px solid var(--line);background:#16120e;border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:2px}
.zb.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:#251a0e}.zb:disabled{opacity:.38}
.zb b{font-size:13px}.zb small{font-size:11px;color:var(--ink3)}.zm{display:flex;gap:1px}
.pool button{font-size:13.5px;padding:6px 14px}
.cardS{border-color:var(--gc)}.cardS .spr{display:block;margin:0 auto}
.pt tr.cur{background:#2a1d10}
.top .ic{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:15px}
.credit{font-size:10.5px;color:var(--ink3);margin-top:6px}
.tabs button{font-size:13px}
.chr .cp1{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}.chr h3 small{color:var(--gold);font-size:14px;margin-left:4px}
.sbar{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;font-size:12px;margin:4px 0}.sbar i{height:9px;background:#0e0b09;border:1px solid var(--line);border-radius:5px;overflow:hidden}.sbar u{display:block;height:100%}.sbar b{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink2)}
.ch4{margin:16px 0 8px;font-size:14px;color:var(--gold);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.ch4 small{color:var(--ink3);font-weight:400;font-size:12px}.ch4 label{margin-left:auto}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stg>div{display:grid;grid-template-columns:1fr auto;gap:0 6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}.stg b{font-size:14px}.stg em{font-style:normal;color:var(--gold);margin-left:4px}.stg small{grid-column:1;font-size:11px;color:var(--ink3)}.stg .btn{grid-row:1/3;grid-column:2}
.btn.sm{padding:6px 12px;font-size:16px}

@media(max-width:560px){.tabs{grid-template-columns:repeat(5,1fr)!important}.tabs button{font-size:12.5px;padding-left:0;padding-right:0}}
.gsel.pool{display:grid;grid-template-columns:repeat(4,1fr)}.gsel.g6{display:grid;grid-template-columns:repeat(3,1fr)}
.cs{font-size:12px;color:var(--ink2);text-align:center;line-height:1.4;padding:0 8px}
.cardS .fx{display:block;font-size:10px;opacity:.9;margin-top:1px}
.ccbox{border:1px solid #2f5a37;background:#0f1a10;border-radius:10px;padding:10px;margin:10px 0;display:grid;gap:4px}.ccbox b{color:#7dff9a}.ccbox small{color:var(--ink2);font-size:12px}
.btn.sm2{flex:none;padding:7px 10px;font-size:12.5px}
.btn.gold{border-color:#a07a2a;background:linear-gradient(#b8892a,#5e4210);color:#fff4d6}.btn.wide{display:block;width:100%;margin-top:8px}
.wl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.wi{display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;border:1px solid var(--line);border-left:3px solid var(--gc);background:#16120e;border-radius:8px;padding:5px 7px}
.wi .spr{grid-row:span 2}.wi b{font-size:12.5px}.wi small{font-size:11px}.wi.on{box-shadow:0 0 0 2px var(--gold);background:#251a0e}
.colsum{border:1px solid #6b4a20;background:#1f170d;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}.colsum b{color:var(--gold)}
.colb{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:#14100c}.colb.done{border-color:var(--gold);box-shadow:inset 0 0 18px rgba(224,176,74,.15)}
.colh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}.colh b{font-size:14px}.colh b small{color:var(--ink2);font-weight:400}.colh>small{color:var(--gold);font-size:12px;text-align:right}
.coli{display:flex;gap:6px;flex-wrap:wrap}
.ci{width:64px;border:1px solid var(--line);border-radius:8px;background:#0e0b08;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px}.ci small{font-size:10px;line-height:1.15;text-align:center}.ci em{font-style:normal;font-size:10px;color:var(--ink2)}
.ci:disabled{opacity:.35}.ci.reg{opacity:1;border-color:var(--gc);box-shadow:inset 0 0 10px color-mix(in srgb,var(--gc) 35%,transparent)}.ci.reg em{color:#7dff9a}.ci.can{border-color:#7dff9a;animation:pulse 1.4s infinite}.ci.can em{color:#7dff9a;font-weight:700}
@keyframes pulse{50%{box-shadow:0 0 10px #7dff9a}}
.ahl{display:grid;gap:6px}
.ahi{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--gc);border-radius:8px;background:#16120e;padding:6px 8px}
.ahi>div{display:flex;flex-direction:column;min-width:0}.ahi b{font-size:13px}.ahi small{font-size:11px;color:var(--ink2)}
.sb3{display:flex!important;flex-direction:column!important;gap:4px}
.lnk{background:none;border:0;color:var(--gold);text-decoration:underline;padding:0;font-size:12px}
.synsum{display:grid;gap:8px;width:min(340px,90vw)}.synsum>div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#16120e;display:grid;grid-template-columns:1fr auto;opacity:0;transform:translateX(-20px);transition:all .3s}.synsum>div.in{opacity:1;transform:none}.synsum small{grid-column:span 2;color:var(--ink2);font-size:11px}
.multi.many{grid-template-columns:repeat(6,46px)}.multi.many .mc{width:46px;height:62px}

.cardS.eq{display:block;padding:6px 4px;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.livea{font-size:12px;color:#9fe3a8;margin:6px 2px 0;min-height:0}.livea:empty{display:none}
.ldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4dff7a;margin-right:6px;box-shadow:0 0 6px #4dff7a;animation:pulse2 1.6s infinite}@keyframes pulse2{50%{opacity:.35}}
.droptbl{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#14100c;display:grid;gap:3px;margin:8px 0}.droptbl b{color:var(--gold);font-size:13px}.droptbl span{font-size:11.5px;color:var(--ink2)}
.drops{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}.drops li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 2px;font-size:12.5px}.drops small{color:var(--ink2);font-size:11px;white-space:nowrap}

.echs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 10px}
.ech{border:1px solid var(--line);border-bottom:3px solid var(--gc);border-radius:8px;background:#16120e;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.ech small{font-size:10px;color:var(--ink2)}.ech b{font-size:12px}.ech.on{box-shadow:0 0 0 2px var(--gold);background:#251a0e}

.side{display:none}
@media(min-width:1000px){
 .app{max-width:1360px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:18px;row-gap:8px;align-items:start;padding:16px 24px 60px}
 .app>.top{grid-column:1/-1;margin-bottom:0}
 .lcol{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:8px}
 .ccol{grid-column:1;grid-row:3;display:flex;flex-direction:column;gap:8px}
 .rcol{grid-column:2;grid-row:2/span 2}
 .lcol .ticker{margin:0}.rcol .tabs{margin-top:0}.heq{margin-top:0}
 .side{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .sbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
 .sbox h4{margin:0 0 8px;font-size:13px;color:var(--gold)}
 .sg{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.sg span{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}.sg b{color:var(--ink,#eee)}
 .sarm{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
 .sarm button{border:1px solid var(--line);border-bottom:3px solid var(--gc);border-radius:8px;background:#16120e;padding:3px 0;display:flex;flex-direction:column;align-items:center}
 .sarm small{font-size:10px;color:var(--ink2)}.sarm b{font-size:11px}
 .slog{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-height:190px;overflow:auto}.slog li{font-size:12px;color:var(--ink2);border-bottom:1px dashed var(--line);padding:2px 0}
 .grid{grid-template-columns:repeat(5,1fr)}
 .zl{grid-template-columns:repeat(3,1fr)}
 .wl{grid-template-columns:repeat(3,1fr)}
 .heq{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:1440px){
 .app{max-width:none;grid-template-columns:clamp(240px,15vw,290px) minmax(0,1fr) clamp(400px,24vw,480px);column-gap:16px}
 .ccol{grid-column:1;grid-row:2;position:sticky;top:12px}
 .lcol{grid-column:2;grid-row:2;position:sticky;top:12px}
 .rcol{grid-column:3;grid-row:2}
 .heq{grid-template-columns:1fr}
 .heq .eq{min-height:0}
 .side{grid-template-columns:1fr}
 .side2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .side2 .slog{max-height:240px}
 .grid{grid-template-columns:repeat(4,1fr)}
 .zl,.wl{grid-template-columns:repeat(2,1fr)}
}

.slog{scrollbar-width:thin;scrollbar-color:#5a4520 transparent}.app>*{min-width:0}
