<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>잿빛 왕관 · 새 주소</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a07;--panel:#1c150e;--line:#6b5228;--gold:#e0b04a;--ink:#efe2c4;--sub:#a99a7c}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#2a1d10,var(--bg) 70%);color:var(--ink);font-family:"Noto Sans KR",sans-serif;display:grid;place-items:center;padding:16px}
.box{width:min(520px,100%);background:linear-gradient(#22190f,#140f09);border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 10px 40px #000;padding:28px 24px;text-align:center}
h1{margin:0 0 6px;font-size:26px;font-weight:900;color:var(--gold);letter-spacing:.08em}
p{margin:8px 0;line-height:1.6;color:var(--sub);font-size:15px}
.url{display:block;margin:18px 0;padding:14px;background:#0a0705;border:1px solid #3a2c18;color:#fff;font-size:20px;font-weight:700;word-break:break-all;text-decoration:none}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border:1px solid #a9844a;background:linear-gradient(#7a5a2a,#4f3816);color:#fff;font:700 17px "Noto Sans KR",sans-serif;cursor:pointer}
.btn.sub{background:#1b2230;border-color:#3a4a66;font-size:15px}
#st{min-height:1.6em;color:#7dff9a}
</style></head><body><div class="box">
<h1>잿빛 왕관</h1>
<p>게임이 더 빠른 새 주소로 이사했어요.</p>
<a class="url" href="https://ash-crown.pages.dev/">ash-crown.pages.dev</a>
<button class="btn" id="mv">내 캐릭터 그대로 새 주소로 가기</button>
<a class="btn sub" href="https://ash-crown.pages.dev/" style="text-decoration:none">새로 시작하기 (캐릭터 없이 이동)</a>
<p id="st"></p>
<p style="font-size:13px">새 주소를 즐겨찾기나 홈 화면에 다시 추가해 주세요.</p>
</div>
<script>
const NEW='https://ash-crown.pages.dev';
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});
const st=document.getElementById('st');
let has=false;try{has=Object.keys(localStorage).some(k=>k.startsWith('ash.'))}catch(e){}
if(!has){document.getElementById('mv').style.display='none'}
let w=null;
document.getElementById('mv').onclick=()=>{w=window.open(NEW+'/?from=gh','_blank');if(!w){st.textContent='새 창이 막혔어요. 팝업 허용 후 다시 눌러 주세요.';return}st.textContent='캐릭터를 옮기는 중…'};
addEventListener('message',e=>{if(e.origin!==NEW||!e.data)return;
 if(e.data.ashReady&&e.source){const D={};try{for(const k of Object.keys(localStorage))if(k.startsWith('ash.'))D[k]=localStorage.getItem(k)}catch(_){}e.source.postMessage({ashData:D},NEW)}
 if(e.data.ashDone){st.textContent='옮기기 완료! 새 창에서 계속하세요. 이 창은 닫아도 돼요.'}});
</script></body></html>
